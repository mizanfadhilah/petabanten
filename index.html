
<!DOCTYPE html>

<link rel="stylesheet"
 href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>

<header>
    <h1>Atlas Interaktif Provinsi Banten</h1>
    <p>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/osmtogeojson@3.0.0/osmtogeojson.js"></script>

<script>
"use strict";

/* =========================================================
   1. PETA DAN PETA DASAR
========================================================= */

const map = L.map("map", {
    zoomControl: true
}).setView([-6.35, 106.15], 8);

const initialBounds = L.latLngBounds(
    [-7.05, 105.05],
    [-5.75, 106.95]
);

const baseMaps = {
    "OpenStreetMap": L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            maxZoom: 19,
            attribution: "&copy; OpenStreetMap contributors"
        }
    ),

    "Topografi": L.tileLayer(
        "https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png",
        {
            maxZoom: 17,
            attribution: "Map data: OpenStreetMap contributors, SRTM | Map style: OpenTopoMap"
        }
    ),

    "Satelit": L.tileLayer(
        "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
        {
            maxZoom: 19,
            attribution: "Tiles &copy; Esri"
        }
    )
};

baseMaps["OpenStreetMap"].addTo(map);


/* =========================================================
   2. KONFIGURASI DATA
   Query dijalankan saat layer dipilih pengguna.
========================================================= */

const OVERPASS_SERVERS = [
    "https://overpass-api.de/api/interpreter",
    "https://overpass.kumi.systems/api/interpreter"
];

const layerDefinitions = [
    {
        key: "province",
        name: "Batas Provinsi Banten",
        color: "#087443",
        weight: 4,
        fill: "#31a86c",
        fillOpacity: 0.12,
        selectors: [
            'relation["boundary"="administrative"]["admin_level"="4"]["name"~"Banten",i]',
            'way["boundary"="administrative"]["admin_level"="4"]["name"~"Banten",i]'
        ]
    },
    {
        key: "regency",
        name: "Batas Kabupaten dan Kota",
        color: "#c13d35",
        weight: 2,
        fill: "#ed8c70",
        fillOpacity: 0.04,
        selectors: [
            'relation["boundary"="administrative"]["admin_level"="6"]',
            'way["boundary"="administrative"]["admin_level"="6"]'
        ]
    },
    {
        key: "village",
        name: "Batas Desa dan Kelurahan",
        color: "#8a56b8",
        weight: 1,
        fill: "#b99ad9",
        fillOpacity: 0.03,
        selectors: [
            'relation["boundary"="administrative"]["admin_level"~"8|9|10"]',
            'way["boundary"="administrative"]["admin_level"~"8|9|10"]'
        ]
    },
    {
        key: "roads",
        name: "Jalan Raya dan Jalan Tol",
        color: "#ed7d21",
        weight: 2.5,
        selectors: [
            'way["highway"~"motorway|trunk|primary|secondary|tertiary|unclassified|residential|motorway_link|trunk_link|primary_link|secondary_link"]'
        ]
    },
    {
        key: "railways",
        name: "Rel Kereta Api",
        color: "#5b3b83",
        weight: 3,
        dashArray: "8 5",
        selectors: [
            'way["railway"="rail"]',
            'way["railway"="light_rail"]',
            'way["railway"="narrow_gauge"]',
            'way["railway"="subway"]'
        ]
    },
    {
        key: "stations",
        name: "Stasiun Kereta Api",
        pointColor: "#5b3b83",
        icon: "🚉",
        selectors: [
            'node["railway"="station"]',
            'node["railway"="halt"]',
            'node["public_transport"="station"]'
        ]
    },
    {
        key: "rivers",
        name: "Sungai dan Aliran Air",
        color: "#168bc1",
        weight: 2,
        selectors: [
            'way["waterway"~"river|stream|canal|drain"]'
        ]
    },
    {
        key: "waterbodies",
        name: "Danau dan Waduk",
        color: "#168bc1",
        fill: "#69c5ed",
        fillOpacity: 0.35,
        weight: 2,
        selectors: [
            'way["natural"="water"]',
            'relation["natural"="water"]',
            'way["landuse"="reservoir"]',
            'relation["landuse"="reservoir"]'
        ]
    },
    {
        key: "bays",
        name: "Teluk dan Wilayah Pesisir",
        color: "#008b99",
        weight: 2,
        fill: "#7dd3dc",
        fillOpacity: 0.22,
        selectors: [
            'node["natural"="bay"]',
            'way["natural"="bay"]',
            'relation["natural"="bay"]'
        ]
    },
    {
        key: "mountains",
        name: "Gunung dan Puncak",
        pointColor: "#9b3c27",
        icon: "⛰️",
        selectors: [
            'node["natural"="peak"]',
            'node["natural"="volcano"]'
        ]
    },
    {
        key: "valleys",
        name: "Lembah",
        color: "#6b8e23",
        weight: 2,
        fill: "#a6c76d",
        fillOpacity: 0.18,
        selectors: [
            'node["natural"="valley"]',
            'way["natural"="valley"]',
            'relation["natural"="valley"]'
        ]
    },
    {
        key: "museums",
        name: "Museum",
        pointColor: "#a0522d",
        icon: "🏛️",
        selectors: [
            'node["tourism"="museum"]',
            'way["tourism"="museum"]',
            'relation["tourism"="museum"]'
        ]
    },
    {
        key: "tourism",
        name: "Tempat Wisata",
        pointColor: "#dc8a16",
        icon: "📍",
        selectors: [
            'node["tourism"~"attraction|viewpoint|zoo|theme_park"]',
            'way["tourism"~"attraction|viewpoint|zoo|theme_park"]',
            'node["historic"]',
            'way["historic"]'
        ]
    },
    {
        key: "settlements",
        name: "Kota, Kecamatan, dan Desa",
        pointColor: "#1565c0",
        icon: "🏘️",
        selectors: [
            'node["place"~"city|town|village|suburb|neighbourhood|hamlet"]'
        ]
    },
    {
        key: "facilities",
        name: "Fasilitas Umum",
        pointColor: "#00796b",
        icon: "●",
        selectors: [
            'node["amenity"~"hospital|school|university|police|fire_station|library"]',
            'node["healthcare"="hospital"]'
        ]
    }
];


/* =========================================================
   3. LAYER CONTROL
========================================================= */

const overlayMaps = {};
const layerObjects = {};
const loadedKeys = new Set();
const loadingKeys = new Set();

layerDefinitions.forEach(def => {
    const layer = L.geoJSON(null, {
        style: function(feature) {
            const p = feature.properties || {};
            const isPoint =
                feature.geometry &&
                feature.geometry.type === "Point";

            return {
                color: def.color || def.pointColor || "#555",
                weight: def.weight || 2,
                dashArray: def.dashArray || null,
                fillColor: def.fill || def.color || "#aaa",
                fillOpacity: def.fillOpacity ?? 0.15,
                radius: 6
            };
        },

        pointToLayer: function(feature, latlng) {
            return L.circleMarker(latlng, {
                radius: 6,
                color: def.pointColor || def.color || "#555",
                weight: 2,
                fillColor: def.pointColor || def.color || "#555",
                fillOpacity: 0.9
            });
        },

        onEachFeature: function(feature, layer) {
            const p = feature.properties || {};
            const tags = p.tags || p;

            const name =
                tags.name ||
                tags["name:id"] ||
                def.name;

            const category =
                tags.amenity ||
                tags.highway ||
                tags.railway ||
                tags.waterway ||
                tags.natural ||
                tags.tourism ||
                tags.place ||
                tags.boundary ||
                def.name;

            const popup = document.createElement("div");
            const title = document.createElement("strong");
            title.textContent = name;
            popup.appendChild(title);

            const categoryLine = document.createElement("div");
            categoryLine.textContent = "Kategori: " + category;
            popup.appendChild(categoryLine);

            if (tags.admin_level) {
                const adminLine = document.createElement("div");
                adminLine.textContent =
                    "Tingkat administrasi: " + tags.admin_level;
                popup.appendChild(adminLine);
            }

            if (tags.operator) {
                const operatorLine = document.createElement("div");
                operatorLine.textContent = "Pengelola: " + tags.operator;
                popup.appendChild(operatorLine);
            }

            if (tags.ele) {
                const elevationLine = document.createElement("div");
                elevationLine.textContent = "Ketinggian: " + tags.ele;
                popup.appendChild(elevationLine);
            }

            layer.bindPopup(popup);
        }
    });

    layerObjects[def.key] = layer;
    overlayMaps[def.name] = layer;
});

L.control.layers(baseMaps, overlayMaps, {
    collapsed: window.innerWidth < 700,
    position: "topright"
}).addTo(map);


/* =========================================================
   4. LEGENDA
========================================================= */

const legend = L.control({ position: "bottomright" });

legend.onAdd = function() {
    const div = L.DomUtil.create("div", "legend");

    div.innerHTML = "<strong>Legenda Peta</strong>";

    layerDefinitions.forEach(def => {
        const row = document.createElement("div");
        const swatch = document.createElement("span");

        if (def.pointColor) {
            swatch.className = "point";
            swatch.style.background = def.pointColor;
        } else {
            swatch.className = "swatch";
            swatch.style.borderTopColor = def.color || "#777";

            if (def.dashArray) {
                swatch.style.borderTopStyle = "dashed";
            }
        }

        row.appendChild(swatch);
        row.appendChild(document.createTextNode(def.name));
        div.appendChild(row);
    });

    return div;
};

legend.addTo(map);


/* =========================================================
   5. QUERY OVERPASS API
========================================================= */

function currentBbox() {
    const bounds = map.getBounds();

    return [
        bounds.getSouth(),
        bounds.getWest(),
        bounds.getNorth(),
        bounds.getEast()
    ].map(n => Number(n.toFixed(5))).join(",");
}

function queryForLayer(def) {
    const bbox = currentBbox();

    // Menghindari permintaan data yang terlalu luas saat zoom jauh.
    if (map.getZoom() < 8 && def.key !== "province" &&
        def.key !== "regency") {
        throw new Error(
            "Perbesar peta terlebih dahulu agar data tidak terlalu besar."
        );
    }

    const selectors = def.selectors
        .map(selector => selector + "(" + bbox + ");")
        .join("\n");

    return `
        [out:json][timeout:45];
        (
            ${selectors}
        );
        out geom;
    `;
}

async function requestOverpass(query) {
    let lastError;

    for (const server of OVERPASS_SERVERS) {
        try {
            const response = await fetch(server, {
                method: "POST",
                headers: {
                    "Content-Type":
                        "application/x-www-form-urlencoded;charset=UTF-8"
                },
                body: "data=" + encodeURIComponent(query)
            });

            if (!response.ok) {
                throw new Error("HTTP " + response.status);
            }

            const data = await response.json();

            if (data.remark) {
                throw new Error(data.remark);
            }

            return data;
        } catch (error) {
            lastError = error;
        }
    }

    throw lastError || new Error("Semua server data tidak merespons.");
}


/* =========================================================
   6. FILTER PROVINSI BANTEN
========================================================= */

function isBantenFeature(feature) {
    const tags = feature.properties?.tags || feature.properties || {};

    const name = String(
        tags.name ||
        tags["name:id"] ||
        tags["official_name"] ||
        ""
    ).trim().toLowerCase();

    // Layer provinsi harus benar-benar bernama Banten.
    if (feature.properties?._layerKey === "province") {
        return name === "banten" ||
               name === "provinsi banten";
    }

    return true;
}


/* =========================================================
   7. MEMUAT LAYER SECARA INTERAKTIF
========================================================= */

async function loadLayer(def, forceReload = false) {
    const layer = layerObjects[def.key];

    if (loadingKeys.has(def.key)) return;

    if (loadedKeys.has(def.key) && !forceReload) return;

    loadingKeys.add(def.key);
    setStatus("Memuat: " + def.name + "...");

    try {
        const query = queryForLayer(def);
        const rawData = await requestOverpass(query);

        if (typeof osmtogeojson !== "function") {
            throw new Error(
                "Library konversi GeoJSON gagal dimuat. Periksa koneksi."
            );
        }

        const geojson = osmtogeojson(rawData);

        // Tandai fitur dengan kategori layer untuk filter.
        geojson.features.forEach(feature => {
            feature.properties = feature.properties || {};
            feature.properties._layerKey = def.key;
        });

        let features = geojson.features;

        // Layer batas provinsi hanya menampilkan Banten.
        if (def.key === "province") {
            features = features.filter(isBantenFeature);

            if (!features.length) {
                throw new Error(
                    "Batas provinsi Banten tidak ditemukan pada data OSM. " +
                    "Coba periksa kembali setelah beberapa saat."
                );
            }
        }

        layer.clearLayers();
        layer.addData({
            type: "FeatureCollection",
            features: features
        });

        loadedKeys.add(def.key);

        if (def.key === "province" && layer.getBounds().isValid()) {
            map.fitBounds(layer.getBounds(), {
                padding: [20, 20],
                maxZoom: 10
            });
        }

        setStatus(
            def.name + ": " + features.length +
            " objek berhasil dimuat."
        );

    } catch (error) {
        console.error("Gagal memuat " + def.name + ":", error);

        setStatus(
            "Gagal memuat " + def.name + ". " + error.message
        );
    } finally {
        loadingKeys.delete(def.key);
    }
}


/* =========================================================
   8. EVENT LAYER CONTROL
========================================================= */

map.on("overlayadd", function(event) {
    const def = layerDefinitions.find(
        item => overlayMaps[item.name] === event.layer
    );

    if (def) {
        loadLayer(def);
    }
});


/* =========================================================
   9. TOMBOL FOKUS KE BANTEN
========================================================= */

document.getElementById("focusBanten")
    .addEventListener("click", function() {
        const provinceLayer = layerObjects.province;

        if (loadedKeys.has("province") &&
            provinceLayer.getBounds().isValid()) {
            map.fitBounds(provinceLayer.getBounds(), {
                padding: [20, 20],
                maxZoom: 10
            });
        } else {
            map.fitBounds(initialBounds);
            loadLayer(
                layerDefinitions.find(d => d.key === "province")
            );
        }
    });


/* =========================================================
   10. MUAT ULANG LAYER AKTIF
========================================================= */

document.getElementById("reloadLayers")
    .addEventListener("click", async function() {
        const activeLayers = layerDefinitions.filter(def =>
            map.hasLayer(layerObjects[def.key])
        );

        if (!activeLayers.length) {
            setStatus("Pilih satu atau beberapa layer terlebih dahulu.");
            return;
        }

        loadedKeys.clear();

        for (const def of activeLayers) {
            await loadLayer(def, true);
        }
    });


/* =========================================================
   11. PENCARIAN TEMPAT
   Menggunakan layanan Nominatim OpenStreetMap.
========================================================= */


/* =====================================================
   PENCARIAN INTERAKTIF WILAYAH DAN TEMPAT
   API: Nominatim OpenStreetMap
===================================================== */

const searchInput = document.getElementById("search");
const searchButton = document.getElementById("searchButton");
const searchResults = document.getElementById("searchResults");
const statusElement = document.getElementById("status");

let searchMarker = null;
let searchTimer = null;
let searchController = null;
let searchSequence = 0;

function showSearchMessage(message) {
    searchResults.replaceChildren();

    const item = document.createElement("div");
    item.className = "search-message";
    item.textContent = message;

    searchResults.appendChild(item);
    searchResults.hidden = false;
}

function closeSearchResults() {
    searchResults.hidden = true;
}

function setSearchStatus(message) {
    if (statusElement) {
        statusElement.textContent = message;
    }
}

/*
 * Mencari lokasi di seluruh Indonesia.
 * Tidak menambahkan kata Banten secara otomatis.
 */
async function searchLocations(query) {
    const keyword = query.trim();

    if (keyword.length < 2) {
        closeSearchResults();
        setSearchStatus("Ketik minimal 2 karakter untuk mencari.");
        return;
    }

    // Batalkan permintaan sebelumnya agar hasil lama tidak menimpa
    // hasil pencarian terbaru.
    if (searchController) {
        searchController.abort();
    }

    searchController = new AbortController();

    const controller = searchController;
    const sequence = ++searchSequence;

    showSearchMessage("Mencari lokasi...");
    setSearchStatus("Sedang mencari: " + keyword);

    const params = new URLSearchParams({
        q: keyword,
        format: "jsonv2",
        addressdetails: "1",
        namedetails: "1",
        countrycodes: "id",
        limit: "8"
    });

    try {
        const response = await fetch(
            "https://nominatim.openstreetmap.org/search?" +
            params.toString(),
            {
                method: "GET",
                headers: {
                    "Accept": "application/json"
                },
                signal: controller.signal
            }
        );

        if (!response.ok) {
            throw new Error(
                "Server pencarian merespons HTTP " + response.status
            );
        }

        const results = await response.json();

        // Abaikan hasil dari permintaan yang sudah kedaluwarsa.
        if (sequence !== searchSequence) {
            return;
        }

        if (!results.length) {
            showSearchMessage(
                "Lokasi tidak ditemukan. Coba nama kota, provinsi, " +
                "kabupaten, atau ejaan lain."
            );

            setSearchStatus("Tidak ada hasil untuk: " + keyword);
            return;
        }

        displaySearchResults(results);
        setSearchStatus(results.length + " hasil ditemukan.");

    } catch (error) {
        if (error.name === "AbortError") {
            return;
        }

        console.error("Pencarian lokasi gagal:", error);

        showSearchMessage(
            "Pencarian gagal. Periksa koneksi internet atau coba lagi " +
            "beberapa saat."
        );

        setSearchStatus("Layanan pencarian sedang tidak tersedia.");
    }
}

/*
 * Membuat daftar hasil dengan DOM API untuk menghindari
 * memasukkan teks hasil server sebagai HTML mentah.
 */
function displaySearchResults(results) {
    searchResults.replaceChildren();

    results.forEach(result => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "search-result";

        const name = document.createElement("span");
        name.className = "search-result-name";

        const address = result.address || {};

        const mainName =
            result.name ||
            address.city ||
            address.town ||
            address.village ||
            address.county ||
            address.state ||
            result.display_name;

        name.textContent = mainName;

        const detail = document.createElement("span");
        detail.className = "search-result-detail";
        detail.textContent = result.display_name || "";

        button.appendChild(name);
        button.appendChild(detail);

        button.addEventListener("click", () => {
            selectSearchResult(result);
        });

        searchResults.appendChild(button);
    });

    searchResults.hidden = false;
}

/*
 * Saat pengguna memilih hasil:
 * - Peta berpindah ke koordinat lokasi.
 * - Marker ditambahkan.
 * - Popup informasi ditampilkan.
 */
function selectSearchResult(result) {
    const lat = Number(result.lat);
    const lon = Number(result.lon);

    if (!Number.isFinite(lat) || !Number.isFinite(lon)) {
        setSearchStatus("Koordinat lokasi tidak valid.");
        return;
    }

    const position = L.latLng(lat, lon);

    if (searchMarker) {
        map.removeLayer(searchMarker);
    }

    searchMarker = L.marker(position).addTo(map);

    const popup = document.createElement("div");
    const title = document.createElement("strong");
    title.textContent = result.name || "Lokasi ditemukan";

    const detail = document.createElement("div");
    detail.textContent = result.display_name || "";

    popup.appendChild(title);
    popup.appendChild(detail);

    searchMarker.bindPopup(popup).openPopup();

    // Zoom lebih dekat untuk satu titik; area yang memiliki bounding box
    // akan ditampilkan sesuai batasnya.
    if (
        Array.isArray(result.boundingbox) &&
        result.boundingbox.length === 4
    ) {
        const south = Number(result.boundingbox[0]);
        const north = Number(result.boundingbox[1]);
        const west = Number(result.boundingbox[2]);
        const east = Number(result.boundingbox[3]);

        const bounds = L.latLngBounds(
            [south, west],
            [north, east]
        );

        if (bounds.isValid()) {
            map.fitBounds(bounds, {
                padding: [25, 25],
                maxZoom: 14
            });
        } else {
            map.setView(position, 13);
        }
    } else {
        map.setView(position, 13);
    }

    searchInput.value =
        result.name || result.display_name || "";

    closeSearchResults();
    setSearchStatus("Lokasi berhasil dipilih pada peta.");
}

/* Tombol Cari */
searchButton.addEventListener("click", () => {
    if (searchTimer) {
        clearTimeout(searchTimer);
    }

    searchLocations(searchInput.value);
});

/* Pencarian otomatis ketika pengguna mengetik (debounce). */
searchInput.addEventListener("input", () => {
    if (searchTimer) {
        clearTimeout(searchTimer);
    }

    if (searchController) {
        searchController.abort();
    }

    const query = searchInput.value.trim();

    if (query.length < 2) {
        closeSearchResults();
        setSearchStatus("Ketik nama wilayah atau tempat.");
        return;
    }

    searchTimer = setTimeout(() => {
        searchLocations(query);
    }, 650);
});

/* Enter untuk mencari. */
searchInput.addEventListener("keydown", event => {
    if (event.key === "Enter") {
        event.preventDefault();

        if (searchTimer) {
            clearTimeout(searchTimer);
        }

        searchLocations(searchInput.value);
    }

    if (event.key === "Escape") {
        closeSearchResults();
    }
});

/* Klik di luar kotak untuk menutup daftar hasil. */
document.addEventListener("click", event => {
    if (!event.target.closest(".search-box")) {
        closeSearchResults();
    }
});

/* Tombol Hapus Pencarian yang sudah ada di toolbar. */
const clearSearchButton = document.getElementById("clearSearch");

if (clearSearchButton) {
    clearSearchButton.addEventListener("click", () => {
        if (searchController) {
            searchController.abort();
        }

        searchInput.value = "";

        if (searchMarker) {
            map.removeLayer(searchMarker);
            searchMarker = null;
        }

        closeSearchResults();
        setSearchStatus("Pencarian dihapus.");
        searchInput.focus();
    });
}


/* =========================================================
   12. STATUS AWAL DAN PEMUATAN BATAS PROVINSI
========================================================= */

map.fitBounds(initialBounds);

loadLayer(
    layerDefinitions.find(def => def.key === "province")
);

</script>
